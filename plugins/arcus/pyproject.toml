[project]
name = "arcus-scripts"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 128
target-version = "py39"

[tool.ruff.lint]
# RUF100 keeps `# noqa` honest: a suppression for an unselected rule is dead weight.
select = ["B", "E", "F", "I", "N", "RUF100", "W", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402",   # import not at top of file (test setup requires it)
    "N806",   # variable in function should be lowercase
]
"scripts/**" = [
    "E402",   # import not at top of file (sys.path setup requires it)
]

[tool.ruff.format]
quote-style = "double"
