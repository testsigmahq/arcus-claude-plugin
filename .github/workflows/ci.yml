name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plugin and marketplace manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid: $f"; exit 1; }
          done

  documents:
    name: document tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/arcus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest
      # The tests that ask a real arcus CLI are skipped here: CI has none.
      - name: Run the document tests
        run: python -m pytest -q
